name: Supabase free-tier keepalive

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call read-only Supabase keepalive RPC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "::error::Configure SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY repository secrets."
            exit 1
          fi
          response_file=$(mktemp)
          status=$(curl --silent --show-error --retry 2 --retry-delay 5 \
            --connect-timeout 10 --max-time 30 \
            -o "$response_file" -w '%{http_code}' \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -X POST -d '{}' \
            "${SUPABASE_URL%/}/rest/v1/rpc/keepalive")
          echo "Supabase RPC HTTP status: $status"
          if [[ "$status" != "200" ]]; then
            echo "::error::Supabase RPC returned HTTP $status"
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); c=str(d.get("code",d.get("error_code","not-provided"))) if isinstance(d,dict) else "not-provided"; print("Supabase error code:", "".join(x for x in c if x.isascii() and (x.isalnum() or x in "_-"))[:80])' "$response_file" || echo "Non-JSON gateway error response"
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); m=str(d.get("message","")) if isinstance(d,dict) else ""; print("Database error detail:", "".join(c for c in m if c.isascii() and (c.isalnum() or c in " _.-"))[:180] or "unavailable")' "$response_file" || true
            exit 1
          fi
          result=$(cat "$response_file")
          if [[ "$result" != "1" ]]; then
            echo "::error::Keepalive returned unexpected response"
            exit 1
          fi
          echo "Supabase database keepalive OK"
